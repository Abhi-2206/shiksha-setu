# Netlify Configuration for Shiksha Setu
# Tells Netlify where the frontend application lives and how to build & deploy it.

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single Page Application (SPA) redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
